name: Booking worker

# Optional recovery runner. Cloud Run events + a one-minute sweep provide prompt processing.
# Enable only after PR 1 rules and this worker are reviewed and deployed to the intended project.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: booking-worker
  cancel-in-progress: false

jobs:
  bookings:
    if: ${{ vars.BOOKING_PROCESSING_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew -p lottery-worker installDist
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_LOTTERY_WORKER_SERVICE_ACCOUNT }}
      - name: Confirm bookings, release rejected stays, and replace declines
        run: ./lottery-worker/build/install/legion-lottery-worker/bin/legion-lottery-worker process-bookings
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          BOOKING_PROCESSING_ENABLED: 'true'
